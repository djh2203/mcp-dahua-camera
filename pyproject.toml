[project]
name = "mcp-dahua-camera"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "netsdk",
    "mcp>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.uv.sources]
netsdk = { path = "vendor/NetSDK-2.0.0.1-py3-none-linux_x86_64.whl" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true